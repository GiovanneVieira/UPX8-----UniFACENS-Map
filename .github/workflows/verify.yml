name: Verificar monorepo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build --workspace=shared
      - run: npm run build --workspace=unifacens-api
      - run: npm run lint --workspace=unifacens-api
      - run: npm run test --workspace=unifacens-api
      - run: npx tsc --noEmit --project unifacens-client/tsconfig.json
      - run: npm exec --workspace=unifacens-client -- expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.org
