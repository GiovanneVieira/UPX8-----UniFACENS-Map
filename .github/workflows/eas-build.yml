# EAS Build (Android) — dispara em push na main que toca o client/shared
# (mudanças significativas) ou manualmente (escolhe o profile).
#
# Pré-requisitos (uma única vez — ver docs/eas-deploy.md):
#   1. GitHub Secret: EXPO_TOKEN (expo.dev → Account Settings → Access Tokens)
#   2. EAS Environment Variables (preview+production): as EXPO_PUBLIC_* de
#      produção (API_URL, AR/RV keys, Maps) — NÃO vão no eas.json (commitado)
#      nem nos secrets do GitHub (o build roda na NUVEM EAS, não no runner).
#   3. app.config.ts: extra.eas.projectId preenchido pelo `eas init`.
#
# Quota: plano free EAS = 30 builds/mês — concurrency cancela builds
# superseded e o filtro de paths evita disparos irrelevantes.
name: EAS Build (Android)

on:
  push:
    branches: [main]
    # ⚠️ paths + paths-ignore JUNTOS no mesmo evento = workflow inválido
    # (falha sem job — regra do GitHub Actions, igua branches/branches-ignore).
    # Exclusões vão como negação '!': dispara se casa um positive E NENHUM
    # negative.
    paths:
      - 'unifacens-client/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/eas-build.yml'
      - '!**/*.md'
      - '!unifacens-client/docs/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile do EAS'
        type: choice
        default: preview
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: eas-build
  cancel-in-progress: true

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: unifacens-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Instala o monorepo inteiro (raiz) — o postinstall do client builda
      # o packages/shared (dist/) — requisito do EAS em monorepos.
      - name: Instalar dependências (raiz do monorepo)
        run: npm ci
        working-directory: .

      # Redundância de segurança: dist garantido mesmo se o postinstall
      # for removido algum dia.
      - name: Buildar packages/shared
        run: npm run build --workspace=shared
        working-directory: .

      # Gate (2026-11-12): valida o CNG ANTES de submeter à fila EAS — prebuild
      # real + assert das meta-data críticas do manifesto. Um prebuild pode ter
      # SUCESSO gerando manifesto INCOMPLETO (o APK só crasha em runtime —
      # lição do crash com.google.android.geo.API_KEY 2026-11-11). Dummies: o
      # gate valida o pipeline config→manifesto; os segredos reais vivem nas
      # EAS Environment Variables da nuvem.
      - name: Gate — invariantes do manifesto Android (antes da fila EAS)
        run: node scripts/assert-manifest.mjs
        env:
          EXPO_PUBLIC_API_URL: https://api.example.org
          EXPO_PUBLIC_GOOGLE_AR_API_KEY: dummy-ci-ar-key
          EXPO_PUBLIC_RV_API_KEY: dummy-ci-rv-key
          EXPO_PUBLIC_RV_PROJECT_ID: dummy-ci-project-id
          EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY: dummy-ci-maps-key
          EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY: dummy-ci-maps-web-key
          EXPO_PUBLIC_GOOGLE_MAPS_MAP_ID: dummy-ci-map-id

      - name: Submeter build ao EAS (nuvem)
        run: npx eas-cli@latest build --platform android --profile "${{ inputs.profile || 'preview' }}" --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
