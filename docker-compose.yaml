services:
  # ============================================================================
  # 1. Banco de Dados Relacional (PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: unifacens-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - .env.api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-unifacens_map}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - unifacens-network

  # ============================================================================
  # 1.5 OTP/Verification Storage (Redis) — melhor-auth secondaryStorage
  # ============================================================================
  # OTPs do better-auth (plugin emailOTP) vivem AQUI quando REDIS_URL está
  # configurado na API (TTL nativo ~300s) — sem volume: restart perde apenas
  # códigos vivos (usuário re-solicita). Sem REDIS_URL a API faz fallback
  # para a `verification` table do Postgres (graceful — dev local sem Redis).
  redis:
    image: redis:7-alpine
    container_name: unifacens-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - unifacens-network

  # ============================================================================
  # 2. Backend API (NestJS 12 + Drizzle ORM)
  # ============================================================================
  api:
    container_name: unifacens-api
    build:
      context: .
      dockerfile: ./unifacens-api/dockerfile
      target: development
    restart: unless-stopped
    init: true
    # ⚠️ Hot reload por ARQUITETURA (lição 2026-11-13): bind mounts de
    # código no Docker Desktop/Windows são CEGOS a inotify — nem escritas
    # internas ao container disparam fs.watch (a escrita atravessa a ponte
    # para o host). Solução canônica: código entregue pelo develop.watch
    # SYNC (escreve no overlay NATIVO do container → inotify dispara →
    # nest --watch recompila). Os volumes abaixo só isolam node_modules.
    develop:
      watch:
        - action: sync
          path: ./packages/shared
          target: /app/packages/shared
        - action: sync
          path: ./unifacens-api/src
          target: /app/unifacens-api/src
        - action: sync
          path: ./unifacens-api/drizzle
          target: /app/unifacens-api/drizzle
        - action: sync
          path: ./unifacens-api/drizzle.config.ts
          target: /app/unifacens-api/drizzle.config.ts
        # Dep nova = rebuild (paths EXPLÍCITOS: globs crasheiam o Compose
        # no Windows — os.Stat("...package*.json") inválido).
        - action: rebuild
          path: ./unifacens-api/package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./packages/shared/package.json
    ports:
      - "8000:8000"
    env_file:
      - .env.api
    environment:
      # No compose a API sempre tem Redis disponível (service acima) — os OTPs
      # (emailOTP) e rate-limits do better-auth vivem no secondaryStorage.
      # Fora do compose (dev no host), vazio = fallback para o Postgres.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /app/node_modules
      - /app/unifacens-api/node_modules
    networks:
      - unifacens-network

  # ============================================================================
  # 3. Frontend Client (Expo SDK 57 / React Native Web)
  # ============================================================================
  client:
    container_name: unifacens-client
    build:
      context: .
      dockerfile: ./unifacens-client/dockerfile
      target: development
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    develop:
      watch:
        # Paths EXPLÍCITOS — globs crasheiam o Compose no Windows (2026-11-13).
        - action: rebuild
          path: ./unifacens-client/package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./packages/shared/package.json
    ports:
      - "8081:8081"
      - "8080:8081"
    env_file:
      - .env.client
    environment:
      # Hot reload em bind mount Windows (idem api — ver nota lá).
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    depends_on:
      - api
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./unifacens-client/src:/app/unifacens-client/src
      - ./unifacens-client/assets:/app/unifacens-client/assets
      - ./unifacens-client/app.json:/app/unifacens-client/app.json
      - /app/node_modules
      - /app/unifacens-client/node_modules
    networks:
      - unifacens-network

# ==============================================================================
# Redes & Volumes Persistentes
# ==============================================================================
networks:
  unifacens-network:
    name: unifacens-network
    driver: bridge

volumes:
  postgres_data:
    name: unifacens_postgres_data
    driver: local
